<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="620" viewBox="0 0 800 620">

  <defs>
    <pattern id="paper" x="0" y="0" width="8" height="8"
             patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.5" fill="#ffffff" opacity="0.035"/>
    </pattern>

    <radialGradient id="glow" cx="0.85" cy="0.05" r="0.6">
      <stop offset="0%" stop-color="#00e0b8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00e0b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="620" fill="#0b0f14"/>
  <rect width="800" height="620" fill="url(#paper)"/>
  <rect width="800" height="620" fill="url(#glow)"/>

  <rect x="0.5" y="0.5" width="799" height="619"
        fill="none" stroke="#c9a961" stroke-width="0.5" opacity="0.15"/>

  <!-- 印章 -->
  <g transform="translate(40, 40)">
    <rect width="44" height="44" rx="3" fill="#b8341f"/>
    <rect x="3" y="3" width="38" height="38" rx="2"
          fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
    <text x="22" y="32" text-anchor="middle"
          font-family="STSong, SimSun, Songti SC, Noto Serif SC, serif" font-size="26"
          font-weight="700" fill="#ffffff">权</text>
  </g>

  <!-- 右上品牌 -->
  <text x="760" y="64" text-anchor="end"
        font-family="STSong, SimSun, Songti SC, Noto Serif SC, serif" font-size="13"
        fill="#5a636e" letter-spacing="2">iTboy</text>

  <!-- 日期 -->
  <text x="40" y="130" font-family="STSong, SimSun, Songti SC, Noto Serif SC, serif" font-size="38"
        font-weight="700" fill="#e8edf2" letter-spacing="1">2026-10-19</text>

  <text x="40" y="162" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14"
        fill="#8b949e" letter-spacing="0.5">星期一 · 丙午年九月初十</text>

  <!-- 分隔线 1 -->
  <line x1="40" y1="195" x2="760" y2="195"
        stroke="#c9a961" stroke-width="0.8" opacity="0.4"/>
  <polygon points="400,191 404,195 400,199 396,195"
           fill="#c9a961" opacity="0.8"/>

  <!-- 摸鱼 -->
  <text x="40" y="235" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12"
        fill="#5a636e" letter-spacing="1.5">本周摸鱼</text>

  <text x="40" y="292" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="46"
        font-weight="700" fill="#5ec9b8">14<tspan font-size="22"
        opacity="0.7">%</tspan></text>

  <rect x="40" y="312" width="300" height="4" rx="2" fill="#1a2028"/>
  <rect x="40" y="312" width="42" height="4" rx="2" fill="#00e0b8"/>

  <text x="40" y="348" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13"
        fill="#8b949e">距离周末还有 5 天</text>

  <!-- 金价 -->
  <text x="460" y="235" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="12"
        fill="#5a636e" letter-spacing="1.5">今日金价</text>

  <text x="460" y="292" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="46"
        font-weight="700" fill="#c9a961">896.74<tspan
        font-size="16" opacity="0.7"> 元/克</tspan></text>

  <text x="460" y="348" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13"
        fill="#8b949e">高 902.67 · 低 896.52</text>

  <!-- 分隔线 2 -->
  <line x1="40" y1="388" x2="760" y2="388"
        stroke="#c9a961" stroke-width="0.8" opacity="0.4"/>
  <polygon points="400,384 404,388 400,392 396,388"
           fill="#c9a961" opacity="0.8"/>

  <!-- 60s -->
  <text x="40" y="428" font-family="STSong, SimSun, Songti SC, Noto Serif SC, serif" font-size="17"
        font-weight="700" fill="#e8edf2" letter-spacing="3">今日 60s</text>

  
  <text x="40" y="465" font-family="STSong, SimSun, Songti SC, Noto Serif SC, serif" font-size="20"
        fill="#5ec9b8" opacity="0.55">壹</text>
  <text x="80" y="465" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14"
        fill="#e8edf2">中央气象台：冷空气接连影响我国，多地气温将创下半年来新低，局地降温超 1…</text>
  <text x="40" y="505" font-family="STSong, SimSun, Songti SC, Noto Serif SC, serif" font-size="20"
        fill="#5ec9b8" opacity="0.55">贰</text>
  <text x="80" y="505" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14"
        fill="#e8edf2">生态环境部发布 10 月下半月全国空气质量预报会商结果：以优良为主</text>
  <text x="40" y="545" font-family="STSong, SimSun, Songti SC, Noto Serif SC, serif" font-size="20"
        fill="#5ec9b8" opacity="0.55">叁</text>
  <text x="80" y="545" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14"
        fill="#e8edf2">国铁集团：今年前三季度全国铁路发送旅客 37.1 亿人次，同比增长 4.…</text>

  <!-- 网址 -->
  <text x="760" y="588" text-anchor="end"
        font-family="STSong, SimSun, Songti SC, Noto Serif SC, serif" font-size="12"
        fill="#5a636e" letter-spacing="1.5">itboy.top</text>

  <line x1="700" y1="595" x2="760" y2="595"
        stroke="#c9a961" stroke-width="0.5" opacity="0.3"/>

</svg>
